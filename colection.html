<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collection | LUME</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="colection.css" />
  </head>
  <body>
    <header class="navbar-wrapper">
      <nav class="navbar navbar-expand-lg">
        <div class="containerr">
          <a href="lume2.html" class="logo"> LUME </a>
          <div class="nav-links">
            <a href="index.html"> HOME </a>
            <a href="lume2.html"> collection </a>
            <a href="lume2.html"> featured </a>
            <a href="./ourstory.html"> about </a>
          </div>
        </div>
      </nav>
    </header>
    <section class="hero" id="collection">
      <picture class="hero-background">
        <source
          media="(max-width: 600px)"
          srcset="hero-collection-mobile.jpeg"
        />
        <img
          src="hero-collection-laptop.jpeg"
          alt="LUME men's and women's fashion"
        />
      </picture>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <p class="eyebrow">THE COLLECTION</p>
        <h1>TIMELESS STYLE</h1>
        <p class="hero-description">
          Modern pieces for every moment. <br />For him and her
        </p>
        <div class="hero-buttons">
          <a href="#men" class="outline-btn">MEN</a>
          <a href="#women" class="outline-btn">WOMEN</a>
        </div>
      </div>
    </section>
    <main class="collections">
      <section class="product-section" id="men">
        <div class="section-heading">
          <h2>MEN</h2>
          <span class="heading-line"></span>
          <a href="#" class="view-all">VIEW ALL</a>
        </div>
        <div class="product-grid" id="men-products">
          <article class="product-card">
            <a href="" class="product-image">
              <img src="knit.jpeg" alt="" />
              <span class="product-tag">ESSENTIAL</span>
            </a>
            <div class="product-info">
              <h3>Knit Sweater</h3>
              <p>$120</p>
            </div>
            <p class="product-category">MEN / TOPS</p>
          </article>
          <article class="product-card">
            <a href="" class="product-image">
              <img src="wool coat.jpeg" alt="wool coat" />
              <span class="product-tag">NEW ARRIVAL</span>
            </a>
            <div class="product-info">
              <h3>Wool Coat</h3>
              <p>$245</p>
            </div>
            <p class="product-category">MEN / OUTWEAR</p>
          </article>
          <article class="product-card">
            <a href="" class="product-image">
              <img src="menpants.jpeg" alt="pants" />
            </a>
            <div class="product-info">
              <h3>Classic Trouser</h3>
              <p>$180</p>
            </div>
            <p class="product-category">MEN / BOTTOM</p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>

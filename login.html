<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width , initial-scale=1.0">
    <title>LUME | Login</title>
    <link rel="stylesheet" href="./login.css ">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-container">
        <div class="image-section">
            <img src="./imglogin.png" alt="lume fashion">
        </div>
        <div class="login-section">
            <a href="./index.html" class="logo">LUME</a>
            <p class="subtitle">TIMELESS PIECES FOR MODERN LIVING</p>
            <div class="login-form">
                <h1>Welcome Back</h1>
                <p class="description">
                    Sign in to continue your journey with LUME
                </p>
                <form id="loginForm">
                    <label for="email">Email Address</label>
                    <input type="text" id="email" placeholder="Enter your email">
                    <small id="emailError"></small>
                    <label for="password">password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                    <small id="passwordError"></small>
                    <div class="show-password">
                        <input type="checkbox" id="showPassword">
                        <label for="showPassword">Show password</label>
                    </div>
                    <div class="form-options">
                        <label class="remember">
                            <input type="checkbox" id="remember">
                            Remember me
                        </label>
                        <a href="#" id="forgotPassword">Forgot Password?</a>
                    </div>
                    <button type="submit" id="loginButton">SIGN IN </button>
                    <P id="message"></P>
                </form>
                <p class="signup"> Don't have an account? <a href="#" id="createAccount">Create account</a>
                 </p>
            </div>
            <a href="index.html" class="back-home">&larr; Back to Home</a>
        </div>
    </div>
    <script src="./login.js"></script>
</body>
</html>
